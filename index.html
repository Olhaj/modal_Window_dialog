<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal window dialog</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body class="body">
    <!-- <button id="openRegisterBtn" class="openRegisterBtn" type="button">Зарегистрироваться</button> -->

    <!-- Первое модальное окно -->
    <!-- <dialog id="registerDialog" class="registerDialog"> -->
    <div class="registrationContent">
        <button id="closeRegisterBtn" class="closeRegisterBtn" type="button">&times;</button>
        <h3 class="registerTitle">Создать аккаунт</h3>
        <form class="registrationForm">
            <label for="name">Имя:</label>
            <input id="name" name="name" type="text" placeholder="Введите имя" required>
            <label for="surname">Фамилия:</label>
            <input id="surname" name="surname" type="text" placeholder="Введите фамилию" required>
            <label for="email">Email:</label>
            <input id="email" name="email" type="email" placeholder="Email:" required>
            <label for="password">Пароль:</label>
            <input id="password" name="password" type="password" placeholder="Пароль:" minlength="8" required>

        </form>
        <button class="switchingBtn" type="submit">Зарегистрироваться</button>
    </div>
    </dialog>

    <!-- Второе модальное окно -->
    <dialog id="confirmationDialog" class="confirmationDialog">
        <div class="confirmationContent">
            <button id="closeConfirmation" class="closeBtn" type="button">&times;</button>
            <h3 class="confirmationTitle">Подтверждение</h3>
            <p class="confirmationText">Вы уверены, что хотите завершить регистрацию?</p>
            <button id="confirmBtn" class="confirmBtn" type="button">Подтвердить</button>
            <button id="cancelBtn" class="cancelBtn" type="button">Отменить</button>
    </dialog>
</body>
<script src="scripts/script.js"></script>

</html>
